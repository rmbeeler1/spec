# Everything the app runs is bundled into out/ by electron-vite, so the
# package contains no node_modules at all.
appId: dev.spec.screenwriter
productName: Spec
directories:
  output: release
files:
  - out/**/*
  - package.json
  - '!node_modules/**/*'
npmRebuild: false
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null
win:
  icon: build/icon.ico
  target:
    - target: nsis
    - target: zip
linux:
  icon: build/icons
  category: Office
  maintainer: rmbeeler1
  target:
    - target: AppImage
    - target: deb
publish:
  provider: github
  owner: rmbeeler1
  repo: spec
