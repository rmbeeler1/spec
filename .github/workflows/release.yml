name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create one shared draft first, otherwise the three parallel platform
  # jobs race and each creates its own draft release.
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release for this tag
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" --notes "Draft. Notes added before publishing."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build and publish installers
        run: pnpm --filter spec-desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
